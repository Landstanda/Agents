# Service Definitions for Agent Execution
# Contains complete technical details for service execution

schedule_meeting:
  name: "Schedule Meeting"
  required_entities:
    - time
    - date
  optional_entities:
    - location
    - participants
    - duration
    - description
  steps:
    - name: "Authenticate"
      tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: create_event
      on_error:
        - action: "retry"
          max_attempts: 3
    - name: "Create Event"
      tool: google_calendar
      id: create_event
      action: execute
      params:
        operation: "create_event"
        summary: "{event_type} Meeting"
        description: "Scheduled via AI Secretary"
        start_time: "{date}T{time}:00"
        end_time: "{date}T{time[:2]}:{str(int(time[3:5]) + 60 if ':' in time else '00')}:00"
        timezone: "America/Los_Angeles"
        location: "{location if location else 'Virtual Meeting'}"
        attendees: "{participants if participants else []}"
      on_success:
        - condition: "response.get('success') and response.get('event_id')"
          next_step: complete
      on_error:
        - condition: "error.get('type') == 'time_conflict'"
          action: "suggest_alternative"
        - condition: "error.get('type') == 'auth_error'"
          action: "retry"
          next_step: "authenticate"
        - action: "notify_error"
  success_criteria:
    - "response.get('success')"
    - "response.get('event_id')"
  error_handling:
    time_conflict:
      message: "There is a scheduling conflict at {time}"
      action: "suggest_alternative"
    creation_error:
      message: "Failed to create event: {error}"
      action: "retry"

email_composer:
  name: "Email Composer"
  required_entities:
    - recipients
    - purpose
  optional_entities:
    - subject
    - context
    - original_email
    - response_type
    - key_points
    - tone
    - cc
    - bcc
    - attachments
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: validate_recipients
      on_error:
        - action: "retry"
          max_attempts: 3

    - name: "Validate Recipients"
      id: validate_recipients
      tool: email_composer
      action: validate_addresses
      params:
        addresses: "{recipients}"
        cc: "{cc if cc else []}"
        bcc: "{bcc if bcc else []}"
      on_success:
        - condition: "response.get('all_valid')"
          next_step: generate_content
      on_error:
        - condition: "error.get('type') == 'invalid_address'"
          action: "request_clarification"
          message: "Some email addresses are invalid: {error.get('details')}"

    - name: "Generate Content"
      id: generate_content
      tool: email_composer
      action: compose
      params:
        to: "{recipients}"
        subject: "{subject if subject else ''}"
        purpose: "{purpose}"
        context: "{context if context else ''}"
        tone: "{tone if tone else 'professional'}"
        original_email: "{original_email if original_email else None}"
        response_type: "{response_type if response_type else 'standard'}"
        key_points: "{key_points if key_points else []}"
      on_success:
        - condition: "response.get('status') == 'success'"
          next_step: prepare_email
      on_error:
        - action: "retry"
          max_attempts: 2

    - name: "Prepare Email"
      id: prepare_email
      tool: email_composer
      action: prepare
      params:
        to: "{recipients}"
        subject: "{response.subject}"
        content: "{response.content}"
        cc: "{cc if cc else []}"
        bcc: "{bcc if bcc else []}"
      on_success:
        - condition: "not attachments"
          next_step: send_email
        - condition: "attachments"
          next_step: handle_attachments
      on_error:
        - action: "retry"
          max_attempts: 3

    - name: "Handle Attachments"
      id: handle_attachments
      tool: email_manager
      action: prepare_attachments
      params:
        attachments: "{attachments}"
      on_success:
        - next_step: send_email
      on_error:
        - condition: "error.get('type') == 'file_not_found'"
          action: "request_clarification"
          message: "Could not find attachment: {error.get('file')}"
        - action: "retry"
          max_attempts: 2

    - name: "Send Email"
      id: send_email
      tool: email_composer
      action: send
      params:
        draft_id: "{response.draft_id}"
      on_success:
        - condition: "response.get('sent')"
          next_step: complete
      on_error:
        - action: "retry"
          max_attempts: 3
          delay_seconds: 5

  success_criteria:
    - "response.get('sent')"
    - "response.get('email_id')"
  error_handling:
    retry_count: 3
    delay_seconds: 5
    conditions:
      network_error: true
      rate_limit: true

email_reader:
  name: "Email Reader"
  required_entities:
    - filter_type
  optional_entities:
    - search_term
    - date_range
    - folder_name
    - max_results
    - include_attachments
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: apply_search_filters
      on_error:
        - action: "retry"
          max_attempts: 3

    - name: "Apply Search Filters"
      id: apply_search_filters
      tool: email_reader
      action: search
      params:
        filter_type: "{filter_type}"
        query: "{search_term if search_term else ''}"
        date_range: "{date_range if date_range else 'today'}"
        folder: "{folder_name if folder_name else 'INBOX'}"
        max_results: "{max_results if max_results else 10}"
      on_success:
        - next_step: check_results

    - name: "Check Results"
      id: check_results
      tool: conditions
      action: execute
      params:
        conditions:
          - if:
              field: "response.results"
              equals: true
            then_step: process_results
            else_step: no_results

    - name: "Process Results"
      id: process_results
      tool: email_reader
      action: process_emails
      params:
        email_ids: "{response.get('email_ids', [])}"
        include_attachments: "{include_attachments if include_attachments else False}"
      on_success:
        - next_step: check_more_emails

    - name: "Check More Emails"
      id: check_more_emails
      tool: conditions
      action: execute
      params:
        loop_check:
          while: "has_more_emails"
          then_step: 1
          else_step: complete

    - name: "No Results Found"
      id: no_results
      tool: message_maker
      action: create_message
      params:
        message_type: "no_results"
        search_params: "{params}"
      on_success:
        - next_step: complete

  success_criteria:
    - "response.get('processed')"
  error_handling:
    retry_count: 3
    delay_seconds: 2
    conditions:
      network_error: true
      auth_error: true

email_manager:
  name: "Email Manager"
  required_entities:
    - action_type
    - email_id
  optional_entities:
    - target_folder
    - flag_type
    - attachment_name
    - new_status
    - classification_schema
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: validate_email
      on_error:
        - action: "retry"
          max_attempts: 3

    - name: "Validate Email ID"
      id: validate_email
      tool: email_reader
      action: validate_email
      params:
        email_id: "{email_id}"
      on_success:
        - condition: "response.get('valid')"
          next_step: classify_email
      on_error:
        - action: "request_clarification"
          message: "Email not found or inaccessible"

    - name: "Classify Email"
      id: classify_email
      tool: email_manager
      action: classify_email
      params:
        email_id: "{email_id}"
      on_success:
        - condition: "response.get('status') == 'success'"
          next_step: process_classification
      on_error:
        - action: "retry"
          max_attempts: 2

    - name: "Process Classification"
      id: process_classification
      tool: email_manager
      action: process_classification
      params:
        classification: "{response.classification}"
        email_id: "{email_id}"
      on_success:
        - next_step: perform_action
      on_error:
        - action: "retry"
          max_attempts: 2

    - name: "Perform Action"
      id: perform_action
      tool: email_manager
      action: "{action_type}"
      params:
        email_id: "{email_id}"
        target_folder: "{target_folder if target_folder else None}"
        flag_type: "{flag_type if flag_type else None}"
        attachment_name: "{attachment_name if attachment_name else None}"
        new_status: "{new_status if new_status else None}"
      on_success:
        - next_step: complete
      on_error:
        - condition: "error.get('type') == 'folder_not_found'"
          action: "create_folder"
          next_step: perform_action
        - action: "retry"
          max_attempts: 2

  success_criteria:
    - "response.get('action_completed')"
  error_handling:
    retry_count: 2
    delay_seconds: 1
    conditions:
      network_error: true
      permission_error: true

conditions:
  name: "Condition Handler"
  required_entities:
    - conditions
  optional_entities:
    - context
    - loop_check
  steps:
    - name: "Evaluate Conditions"
      tool: conditions
      action: execute
      params:
        conditions: "{conditions}"
        context: "{context if context else {}}"
        loop_check: "{loop_check if loop_check else None}"
      on_success:
        - condition: "response.get('status') == 'success' and response.get('result') is not None"
          next_step: process_result
        - condition: "response.get('status') == 'success' and response.get('continue_loop') is not None"
          next_step: process_loop
      on_error:
        - condition: "error.get('type') == 'invalid_field'"
          action: "notify_error"
          message: "Invalid field path specified"
        - condition: "error.get('type') == 'invalid_condition'"
          action: "notify_error"
          message: "Invalid condition format"
        - action: "retry"
          max_attempts: 2

    - name: "Process Result"
      id: process_result
      tool: conditions
      action: execute
      params:
        conditions:
          field: "response.result"
          equals: true
      on_success:
        - condition: "response.get('result')"
          next_step: "{response.get('next_step', 'complete')}"
        - condition: "not response.get('result')"
          next_step: "{response.get('else_step', 'complete')}"
      on_error:
        - action: "notify_error"
          message: "Failed to process condition result"

    - name: "Process Loop"
      id: process_loop
      tool: conditions
      action: execute
      params:
        conditions:
          field: "response.continue_loop"
          equals: true
      on_success:
        - condition: "response.get('result')"
          next_step: "{response.get('next_step', 1)}"
        - condition: "not response.get('result')"
          next_step: "{response.get('else_step', 'complete')}"
      on_error:
        - action: "notify_error"
          message: "Failed to process loop condition"

  success_criteria:
    - "response.get('status') == 'success'"
    - "response.get('result') is not None or response.get('continue_loop') is not None"
  error_handling:
    retry_count: 2
    delay_seconds: 1
    conditions:
      invalid_field: true
      invalid_condition: true
      evaluation_error: true 