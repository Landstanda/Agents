# Service Definitions for Agent Execution
# Contains complete technical details for service execution

test_service:
  name: "Test Service"
  required_entities:
    - test_entity
  steps:
    - name: "Test Step"
      tool: test_tool
      action: execute
      params: {}
      success_criteria:
        type: "all"
        conditions:
          - "response['success'] == True"
        on_success:
          next_step: "complete"
        on_failure:
          action: "retry"
          max_attempts: 1
          params:
            delay_seconds: 1

schedule_meeting:
  name: "Schedule Meeting"
  required_entities:
    - time
    - date
  optional_entities:
    - location
    - participants
    - duration
    - description
  steps:
    - name: "Authenticate"
      tool: google_auth
      action: execute
      params: {}
      success_criteria:
        type: "all"
        conditions:
          - "response['success'] == True"
          - "response['credentials'] is not None"
          - "response['credentials']['valid'] == True"
        on_success:
          next_step: "create_event"
        on_failure:
          action: "retry"
          max_attempts: 3
          params:
            delay_seconds: 5
    - name: "Create Event"
      tool: google_calendar
      action: "create_event"
      params:
        operation: "create_event"
        summary: "{event_type} Meeting"
        description: "Scheduled via AI Secretary"
        start_time: "{date}T{time}:00"
        end_time: "{date}T{time[:2]}:{str(int(time[3:5]) + 60 if ':' in time else '00')}:00"
        timezone: "America/Los_Angeles"
        location: "{location if location else 'Virtual Meeting'}"
        attendees: "{participants if participants else []}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.event_id is not None"
        on_success:
          next_step: "complete"
        on_failure:
          actions:
            - condition: "response.error_type == 'time_conflict'"
              action: "suggest_alternative"
              params:
                message: "There is a scheduling conflict at {time}"
            - condition: "response.error_type == 'auth_error'"
              action: "retry"
              target_step: "authenticate"
              params:
                max_attempts: 3
            - condition: "response.error_type == 'invalid_time'"
              action: "request_clarification"
              params:
                message: "The specified time {time} is invalid. Please provide a valid time."
          action: "notify_error"
          params:
            message: "Failed to create event: {error}"

email_composer:
  name: "Email Composer"
  required_entities:
    - recipients
    - purpose
  optional_entities:
    - subject
    - context
    - original_email
    - response_type
    - key_points
    - tone
    - cc
    - bcc
    - attachments
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.credentials is not None"
        on_success:
          next_step: "validate_recipients"
        on_failure:
          action: "retry"
          max_attempts: 3
          params:
            delay_seconds: 5

    - name: "Validate Recipients"
      tool: email_composer
      action: validate_addresses
      params:
        addresses: "{recipients}"
        cc: "{cc if cc else []}"
        bcc: "{bcc if bcc else []}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.all_valid == True"
        on_success:
          next_step: "generate_content"
        on_failure:
          actions:
            - condition: "response.error_type == 'invalid_address'"
              action: "request_clarification"
              params:
                message: "Some email addresses are invalid: {response.data.invalid_addresses}"

    - name: "Generate Content"
      tool: email_composer
      action: compose
      params:
        to: "{recipients}"
        subject: "{subject if subject else ''}"
        purpose: "{purpose}"
        context: "{context if context else ''}"
        tone: "{tone if tone else 'professional'}"
        original_email: "{original_email if original_email else None}"
        response_type: "{response_type if response_type else 'standard'}"
        key_points: "{key_points if key_points else []}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.content is not None"
        on_success:
          next_step: "prepare_email"
        on_failure:
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 3

    - name: "Prepare Email"
      tool: email_composer
      action: prepare
      params:
        to: "{recipients}"
        subject: "{response.data.subject}"
        content: "{response.data.content}"
        cc: "{cc if cc else []}"
        bcc: "{bcc if bcc else []}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.draft_id is not None"
        on_success:
          next_step:
            condition: "attachments is not None"
            then: "handle_attachments"
            else: "send_email"
        on_failure:
          action: "retry"
          max_attempts: 3
          params:
            delay_seconds: 2

    - name: "Handle Attachments"
      tool: email_manager
      action: prepare_attachments
      params:
        attachments: "{attachments}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.prepared_attachments is not None"
        on_success:
          next_step: "send_email"
        on_failure:
          actions:
            - condition: "response.error_type == 'file_not_found'"
              action: "request_clarification"
              params:
                message: "Could not find attachment: {response.data.missing_file}"
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 2

    - name: "Send Email"
      tool: email_composer
      action: send
      params:
        draft_id: "{response.data.draft_id}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.sent == True"
          - "response.data.email_id is not None"
        on_success:
          next_step: "complete"
        on_failure:
          action: "retry"
          max_attempts: 3
          params:
            delay_seconds: 5

email_reader:
  name: "Email Reader"
  required_entities:
    - filter_type
  optional_entities:
    - search_term
    - date_range
    - folder_name
    - max_results
    - include_attachments
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.credentials is not None"
        on_success:
          next_step: "apply_search_filters"
        on_failure:
          action: "retry"
          max_attempts: 3
          params:
            delay_seconds: 5

    - name: "Apply Search Filters"
      tool: email_reader
      action: search
      params:
        filter_type: "{filter_type}"
        query: "{search_term if search_term else ''}"
        date_range: "{date_range if date_range else 'today'}"
        folder: "{folder_name if folder_name else 'INBOX'}"
        max_results: "{max_results if max_results else 10}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step: "check_results"
        on_failure:
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 2

    - name: "Check Results"
      tool: conditions
      action: execute
      params:
        conditions:
          - if:
              field: "response.data.results"
              equals: true
            then_step: "process_results"
            else_step: "no_results"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step:
            condition: "response.data.results"
            then: "process_results"
            else: "no_results"
        on_failure:
          action: "error"
          params:
            message: "Failed to check results"

    - name: "Process Results"
      tool: email_reader
      action: process_emails
      params:
        email_ids: "{response.data.email_ids}"
        include_attachments: "{include_attachments if include_attachments else False}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.processed == True"
        on_success:
          next_step: "check_more_emails"
        on_failure:
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 2

    - name: "Check More Emails"
      tool: conditions
      action: execute
      params:
        loop_check:
          while: "response.data.has_more_emails"
          then_step: "process_results"
          else_step: "complete"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step:
            condition: "response.data.has_more_emails"
            then: "process_results"
            else: "complete"
        on_failure:
          action: "error"
          params:
            message: "Failed to check for more emails"

    - name: "No Results Found"
      tool: message_maker
      action: create_message
      params:
        message_type: "no_results"
        search_params: "{params}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step: "complete"
        on_failure:
          action: "error"
          params:
            message: "Failed to create no results message"

email_manager:
  name: "Email Manager"
  required_entities:
    - action_type
    - email_id
  optional_entities:
    - target_folder
    - flag_type
    - attachment_name
    - new_status
    - classification_schema
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.credentials is not None"
        on_success:
          next_step: "validate_email"
        on_failure:
          action: "retry"
          max_attempts: 3
          params:
            delay_seconds: 5

    - name: "Validate Email ID"
      tool: email_reader
      action: validate_email
      params:
        email_id: "{email_id}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.valid == True"
        on_success:
          next_step: "classify_email"
        on_failure:
          action: "request_clarification"
          params:
            message: "Email not found or inaccessible"

    - name: "Classify Email"
      tool: email_manager
      action: classify_email
      params:
        email_id: "{email_id}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.classification is not None"
        on_success:
          next_step: "process_classification"
        on_failure:
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 2

    - name: "Process Classification"
      tool: email_manager
      action: process_classification
      params:
        classification: "{response.data.classification}"
        email_id: "{email_id}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step: "perform_action"
        on_failure:
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 2

    - name: "Perform Action"
      tool: email_manager
      action: "{action_type}"
      params:
        email_id: "{email_id}"
        target_folder: "{target_folder if target_folder else None}"
        flag_type: "{flag_type if flag_type else None}"
        attachment_name: "{attachment_name if attachment_name else None}"
        new_status: "{new_status if new_status else None}"
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
          - "response.data.action_completed == True"
        on_success:
          next_step: "complete"
        on_failure:
          actions:
            - condition: "response.error_type == 'folder_not_found'"
              action: "create_folder"
              next_step: "perform_action"
          action: "retry"
          max_attempts: 2
          params:
            delay_seconds: 2

  success_criteria:
    - "response.get('action_completed')"
  error_handling:
    retry_count: 2
    delay_seconds: 1
    conditions:
      network_error: true
      permission_error: true

conditions:
  name: "Condition Handler"
  required_entities:
    - conditions
  optional_entities:
    - context
    - loop_check
  steps:
    - name: "Evaluate Conditions"
      tool: conditions
      action: execute
      params:
        conditions: "{conditions}"
        context: "{context if context else {}}"
        loop_check: "{loop_check if loop_check else None}"
      on_success:
        type: "any"
        conditions:
          - "response.get('status') == 'success' and response.get('result') is not None"
          - "response.get('status') == 'success' and response.get('continue_loop') is not None"
        next_steps:
          - condition: "response.get('status') == 'success' and response.get('result') is not None"
            next_step: "process_result"
          - condition: "response.get('status') == 'success' and response.get('continue_loop') is not None"
            next_step: "process_loop"
      on_failure:
        actions:
          - condition: "error.get('type') == 'invalid_field'"
            action: "notify_error"
            params:
              message: "Invalid field path specified"
          - condition: "error.get('type') == 'invalid_condition'"
            action: "notify_error"
            params:
              message: "Invalid condition format"
        action: "retry"
        max_attempts: 2

    - name: "Process Result"
      id: process_result
      tool: conditions
      action: execute
      params:
        conditions:
          field: "response.result"
          equals: true
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step:
            condition: "response.get('result')"
            then: "{response.get('next_step', 'complete')}"
            else: "{response.get('else_step', 'complete')}"
        on_failure:
          action: "notify_error"
          params:
            message: "Failed to process condition result"

    - name: "Process Loop"
      id: process_loop
      tool: conditions
      action: execute
      params:
        conditions:
          field: "response.continue_loop"
          equals: true
      success_criteria:
        type: "all"
        conditions:
          - "response.success == True"
        on_success:
          next_step:
            condition: "response.get('result')"
            then: "{response.get('next_step', 1)}"
            else: "{response.get('else_step', 'complete')}"
        on_failure:
          action: "notify_error"
          params:
            message: "Failed to process loop condition"

  success_criteria:
    - "response.get('status') == 'success'"
    - "response.get('result') is not None or response.get('continue_loop') is not None"
  error_handling:
    retry_count: 2
    delay_seconds: 1
    conditions:
      invalid_field: true
      invalid_condition: true
      evaluation_error: true

services:
  test_service:
    name: "Test Service"
    required_entities:
      - test_entity
    steps:
      - name: "Test Step"
        tool: test_tool
        action: execute
        params: {}
        success_criteria:
          type: "all"
          conditions:
            - "response['success'] == True"
          on_success:
            next_step: "complete"
          on_failure:
            action: "retry"
            max_attempts: 1
            params:
              delay_seconds: 1 