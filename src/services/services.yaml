# Core Business Services

schedule_meeting:
  name: "Schedule Meeting"
  description: "Schedule a meeting with specified participants"
  identifier: "schedule_meeting"
  triggers:
    - "schedule"
    - "book"
    - "plan"
    - "arrange"
    - "meeting"
    - "lunch"
    - "appointment"
  required_entities:
    - time
    - date
  optional_entities:
    - location
    - participants
  steps:
    - name: "Authenticate"
      tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: create_event
      on_error:
        - action: "retry"
          max_attempts: 3
    - name: "Create Event"
      tool: google_calendar
      id: create_event
      action: execute
      params:
        operation: "create_event"
        summary: "{event_type} Meeting"
        description: "Scheduled via AI Secretary"
        start_time: "{date}T{time}:00"
        end_time: "{date}T{time[:2]}:{str(int(time[3:5]) + 60 if ':' in time else '00')}:00"
        timezone: "America/Los_Angeles"
        location: "{location if location else 'Virtual Meeting'}"
        attendees: "{participants if participants else []}"
      on_success:
        - condition: "response.get('success') and response.get('event_id')"
          next_step: complete
      on_error:
        - condition: "error.get('type') == 'time_conflict'"
          action: "suggest_alternative"
        - condition: "error.get('type') == 'auth_error'"
          action: "retry"
          next_step: "authenticate"
        - action: "notify_error"
  success_criteria:
    - "response.get('success')"
    - "response.get('event_id')"
  error_handling:
    time_conflict:
      message: "There is a scheduling conflict at {time}"
      action: "suggest_alternative"
    creation_error:
      message: "Failed to create event: {error}"
      action: "retry"

schedule_and_notify:
  name: "Schedule Meeting with Notifications"
  description: "Schedule a meeting and send detailed notifications to participants"
  identifier: "schedule_notify"
  triggers:
    - "schedule"
    - "book"
    - "plan"
    - "arrange"
    - "meeting"
    - "lunch"
    - "appointment"
    - "notify"
    - "remind"
    - "email"
    - "send"
    - "alert"
  required_entities:
    - time
    - participants
  optional_entities:
    - location
    - duration
    - reminder_time
    - message
    - end_time
  steps:
    - tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: check_availability
    - tool: google_calendar
      id: check_availability
      action: execute
      params:
        operation: "check_availability"
        start_time: "{date}T{time}:00"
        end_time: "{date}T{time[:2]}:{str(int(time[3:5]) + 60 if ':' in time else '00')}:00"
        timezone: "America/Los_Angeles"
        attendees: "{participants}"
      on_success:
        - condition: "response.get('success') and response.get('is_available')"
          next_step: create_event
        - condition: "not response.get('is_available')"
          next_step: notify_conflict
    - tool: google_calendar
      id: create_event
      action: execute
      params:
        operation: "create_event"
        summary: "Meeting with {', '.join(participants)}"
        description: "{message if message else 'Scheduled meeting'}"
        start_time: "{date}T{time}:00"
        end_time: "{date}T{time[:2]}:{str(int(time[3:5]) + 60 if ':' in time else '00')}:00"
        timezone: "America/Los_Angeles"
        location: "{location if location else ''}"
        attendees: "{participants}"
        reminders: {"useDefault": false, "overrides": [{"method": "email", "minutes": 30}]}
      on_success:
        - condition: "response.get('success')"
          next_step: send_notification
        - condition: "not response.get('success')"
          next_step: notify_error
    - tool: email
      id: send_notification
      action: send_email
      params:
        to_address: "{participants}"
        subject: "Meeting Scheduled: {summary}"
        body: "A meeting has been scheduled for {time}.\nLocation: {location if location else 'Not specified'}\nLink: {response.get('html_link')}\n\n{message if message else ''}"
  success_criteria:
    - "response.get('success')"
    - "response.get('event_id')"
    - "response.get('html_link')"
  error_handling:
    time_conflict:
      message: "There is a scheduling conflict at {time}"
      action: "suggest_alternative"
    creation_error:
      message: "Failed to create event: {error}"
      action: "retry"
    notification_failed:
      message: "Could not send notifications to {failed_recipients}"
      action: "retry"

check_emails:
  name: "Check New Emails"
  description: "Check for new unread emails in Gmail inbox"
  identifier: "check_emails"
  triggers:
    - "check"
    - "read"
    - "get"
    - "show"
    - "view"
    - "emails"
    - "email"
    - "inbox"
    - "messages"
    - "unread"
  required_entities: []  # No required entities as it's a simple check
  optional_entities:
    - max_emails  # Optional number of emails to fetch
  steps:
    - name: "Authenticate Google"
      tool: google_auth
      action: execute
      params: {}
      on_success:
        - condition: "response.get('success')"
          next_step: fetch_emails
      on_error:
        - action: "retry"
          max_attempts: 3
    - name: "Fetch Recent Emails"
      id: fetch_emails
      tool: email_reader
      action: execute
      params:
        operation: "get_recent_emails"
        max_emails: 1  # Set to just one email
        unread_only: true
      on_success:
        - condition: "response.get('success') and response.get('emails')"
          next_step: complete
      on_error:
        - condition: "error.get('type') == 'auth_error'"
          action: "retry"
          next_step: "authenticate"
        - action: "notify_error"
  success_criteria:
    - "response.get('success')"
    - "response.get('emails')"
  error_handling:
    auth_error:
      message: "Failed to authenticate with Google: {error}"
      action: "retry"
    fetch_error:
      message: "Failed to fetch emails: {error}"
      action: "notify_error"
