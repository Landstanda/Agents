schedule_meeting:
  executor_type: calendar
  steps:
  - action: check_availability
    name: validate_time
    params:
      date: '{date}'
      time: '{time}'
      timezone: America/Los_Angeles
    tool: calendar
  - action: create_event
    name: create_event
    params:
      attendees: '{participants}'
      date: '{date}'
      description: Scheduled via calendar integration test
      duration: '60'
      start_time: '{time}'
      summary: Meeting with {participants}
      timezone: America/Los_Angeles
    tool: calendar
